[package]
name = "hardware"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A printCAD workbench package: standard hardware sized from its standards"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# The SDK comes from the printCAD repository. While it needs what is not
# on the published master yet (today: the edit-feature event and
# doc.remove_body), it is read from the checkout beside this one; to
# release, switch back to
#   printcad-bench-sdk = { git = "https://github.com/gilbertorconde/printCAD", branch = "master" }
# and run `cargo update -p printcad-bench-sdk` once printCAD is pushed.
printcad-bench-sdk = { path = "../printCAD/sdk/printcad-bench-sdk" }
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
