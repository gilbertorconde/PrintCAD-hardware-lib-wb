[package]
name = "hardware"
version = "0.4.3"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A printCAD workbench package: standard hardware sized from its standards"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# The SDK comes from the printCAD repository; to build against a local
# printCAD, point this at the checkout's `sdk/printcad-bench-sdk` instead.
printcad-bench-sdk = { git = "https://github.com/gilbertorconde/printCAD", tag = "v0.6.0" }
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
