[package]
name = "hardware"
version = "0.4.3"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A printCAD workbench package: standard hardware sized from its standards"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# The SDK from crates.io; to build against a local printCAD, add a
# [patch.crates-io] naming the checkout's crates (see README).
printcad-bench-sdk = "0.1"
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
